# Configuración para Render (https://render.com).
#
# Render lee este archivo y arma el servicio solo: no hay que instalar nada ni
# usar terminal. En el panel: New -> Blueprint -> conectar este repositorio.
#
# Lo único que queda por hacer a mano después del primer despliegue es apuntar
# WEB_ORIGIN a la dirección definitiva, y sólo si usas un dominio propio.

services:
  - type: web
    name: cuentas-hogar
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Rama que se publica. Sin esto, Render toma la rama por defecto del
    # repositorio, que no es donde está el código de la app.
    branch: claude/shared-expense-management-app-5yyoxu
    # El plan gratuito no admite disco persistente y apaga el servicio al rato:
    # los datos se perderían. Éste es el más barato que sirve de verdad.
    plan: starter
    region: ohio
    healthCheckPath: /api/health
    # Con SQLite tiene que haber una sola instancia, o serían dos copias
    # distintas de la misma base.
    numInstances: 1
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/hogar.db
      # RENDER_EXTERNAL_URL no se declara acá: Render la inyecta sola, y la app
      # la toma como origen público si no hay WEB_ORIGIN. Declararla sería una
      # referencia del servicio a sí mismo.
      #
      # La primera cuenta se puede crear sin código porque la base está vacía;
      # de ahí en adelante hace falta invitación.
      - key: ALLOW_SIGNUP
        value: invite
      - key: TRUST_PROXY
        value: "1"
      # Render la genera sola y no queda escrita en ninguna parte del repo.
      - key: JWT_SECRET
        generateValue: true

    # Acá vive la base de datos. Sin esto, cada despliegue borraría todo.
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
