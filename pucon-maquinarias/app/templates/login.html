<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · {{ empresa.empresa_nombre }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="pantalla-login">
  <form class="caja-login formulario" method="post">
    <div class="marca"><div class="logo">P</div><div><b>{{ empresa.empresa_nombre }}</b><small class="suave">Gestión de arriendos</small></div></div>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}<div class="aviso {{ categoria }}" style="margin-bottom:12px">{{ texto }}</div>{% endfor %}
    {% endwith %}
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="campo" style="margin-bottom:12px"><label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
    <div class="campo" style="margin-bottom:18px"><label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%" type="submit">Ingresar</button>
  </form>
</div>
</body>
</html>
