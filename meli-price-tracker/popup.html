<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>📉 Meli Price Tracker</h1>
    <button id="refresh" title="Revisar precios seguidos ahora">↻</button>
  </header>
  <nav>
    <button data-tab="tracked" class="active">Siguiendo <span id="n-tracked"></span></button>
    <button data-tab="seen">Vistos <span id="n-seen"></span></button>
  </nav>
  <main id="list"></main>
  <p id="empty" hidden></p>
  <footer>
    <label><input type="checkbox" id="community"> Base comunitaria (anónima)</label>
    <a href="welcome.html" target="_blank">Qué se envía</a>
    <button id="wipe" title="Borra del servidor todo lo que aportaste">Borrar mis aportes</button>
    <span id="foot-msg" role="status"></span>
  </footer>
  <script src="lib/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
