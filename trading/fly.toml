# Fly.io: una sola máquina siempre encendida con un volumen persistente.
# Despliegue:
#   fly launch --no-deploy --name mi-trading-bot
#   fly volumes create trading_data --size 1 --region scl
#   fly secrets set ALPACA_API_KEY=... ALPACA_SECRET_KEY=... ANTHROPIC_API_KEY=... HEALTH_TOKEN=...
#   fly deploy
app = "trading-bot"
primary_region = "scl"          # Santiago; usa "iad" para menor latencia a Alpaca

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "/data/trading_bot.db"
  LOG_FILE = "/data/logs/trading_bot.jsonl"
  HEALTH_PORT = "8080"
  ALPACA_BASE_URL = "https://paper-api.alpaca.markets"
  EXCHANGE = "XNYS"

[mounts]
  source = "trading_data"
  destination = "/data"

# El bot es un proceso de fondo que además expone /health. Nunca debe escalar a
# cero ni correr dos instancias: dos schedulers sobre la misma cuenta duplicarían
# órdenes.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
