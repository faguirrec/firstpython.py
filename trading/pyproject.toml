[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Autonomous multi-agent trading bot on the Alpaca API (NewsPulse, TraderCore, RiskSentinel, LearningLoop)."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.21,<1.0",
    "anthropic>=0.40,<1.0",
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analysis = ["pandas>=2.0", "numpy>=1.26"]
backtest = ["yfinance>=0.2"]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_bot = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
